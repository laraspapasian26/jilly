<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Random Image Gallery</title>\n    <style>\n        body {\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            background-color: #f0f0f0;\n            margin: 0;\n            padding: 0;\n        }\n        .gallery {\n            display: flex;\n            flex-wrap: wrap;\n            justify-content: center;\n            max-width: 1000px;\n            margin: 20px;\n        }\n        .gallery-item {\n            margin: 10px;\n            border: 1px solid #ccc;\n            border-radius: 5px;\n            overflow: hidden;\n            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);\n            background: white;\n        }\n        .gallery-item img {\n            max-width: 100%;\n            height: auto;\n            display: block;\n        }\n        .description {\n            padding: 10px;\n            font-size: 14px;\n            text-align: center;\n        }\n    </style>\n</head>\n<body>\n    <h1>Random Image Gallery</h1>\n    <div class="gallery" id="gallery"></div>\n    <script>\n        const gallery = document.getElementById('gallery');\n        const images = [];  // Populate with the paths to your images\n        const descriptions = [];  // Populate with the descriptions from your CSV\n\n        // Function to load images and descriptions\n        async function loadImages() {\n            // Assuming you fetch descriptions from a CSV file or other source\n            const response = await fetch('descriptions.csv');\n            const data = await response.text();\n            const rows = data.split('\n');\n            for (let row of rows) {\n                const cols = row.split(',');\n                if (cols.length > 1) {\n                    images.push(cols[0].trim());  // Image path\n                    descriptions.push(cols[1].trim());  // Description\n                }\n            }\n            displayImages();\n        }\n\n        function displayImages() {\n            for (let i = 0; i < images.length; i++) {\n                const item = document.createElement('div');\n                item.className = 'gallery-item';\n                item.innerHTML = `\n                    <img src='${images[i]}' alt='Image ${i + 1}'>\n                    <div class='description'>${descriptions[i]}</div>\n                `;\n                gallery.appendChild(item);\n            }\n        }\n\n        loadImages();\n    </script>\n</body>\n</html>
