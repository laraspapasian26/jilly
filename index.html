<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF5CCC 0%, #512889 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeIn 0.6s ease-in;
        }

        .title {
            text-align: center;
            padding: 20px 15px 10px;
            
            /* Auto-scale */
            font-size: clamp(16px, 4vw, 26px);
            
            /* Force single line */
            white-space: nowrap;
            
            color: #d81b60;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }
        
        .image-wrapper {
            width: 100%;
            height: auto;
            overflow: hidden;
            background: #f0f0f0;
        }
        
        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        .content {
            padding: 30px 20px;
            text-align: center;
        }
        
        .description {
            color: #666;
            font-size: clamp(14px, 4vw, 18px);
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-next {
            background: linear-gradient(135deg, #ff2e93 0%, #a18cd1 100%);
            color: white;
            flex: 1;
            min-width: 140px;
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.4);
        }
        
        .btn-next:active {
            transform: translateY(0);
        }
        
        .error {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .container {
                border-radius: 15px;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="title">✨ Let Jilly read your fortune ✨</h2>

        <div class="image-wrapper" id="imageWrapper">
            <img id="randomImage" src="" alt="Gallery image">
        </div>

        <div class="content">
            <p class="description" id="imageDescription"></p>
            <div class="button-group">
                <button class="btn-next" onclick="loadRandomImage()">Next Fortune 🔮</button>
            </div>
        </div>
    </div>

    <script>
        let images = [];
        let currentIndex = 0;

        async function initGallery() {
            try {
                const response = await fetch('images/descriptions.csv');
                if (!response.ok) throw new Error('Could not load CSV file');
                
                const csvData = await response.text();
                const rows = csvData.split('\n').filter(row => row.trim());
                
                const startIndex = rows[0].toLowerCase().includes('filename') ? 1 : 0;
                
                for (let i = startIndex; i < rows.length; i++) {
                    const [filename, ...descParts] = rows[i].split(',');
                    if (filename && filename.trim()) {
                        images.push({
                            filename: filename.trim(),
                            description: descParts.join(',').trim() || 'No description'
                        });
                    }
                }
                
                if (images.length === 0) {
                    showError('No fortunes found. Please add data to the CSV file.');
                    return;
                }
                
                loadRandomImage();
            } catch (error) {
                showError('Error loading gallery: ' + error.message);
            }
        }

        function loadRandomImage() {
            if (images.length === 0) return;
            
            currentIndex = Math.floor(Math.random() * images.length);
            const image = images[currentIndex];
            
            document.getElementById('imageDescription').textContent = image.description;
            document.getElementById('randomImage').src = 'images/' + image.filename;
        }

        function showError(message) {
            const container = document.querySelector('.container');
            container.innerHTML = `<div class="error"><p>${message}</p></div>`;
        }

        initGallery();
    </script>
</body>
</html>
